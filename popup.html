<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>reCAPTCHA Solver</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        width: 340px;
        margin: 0;
        padding: 14px;
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      h1 { font-size: 15px; margin: 0 0 4px; }
      p.sub { margin: 0 0 12px; opacity: .7; font-size: 12px; }
      label { display: block; margin: 10px 0 4px; font-weight: 600; font-size: 12px; }
      input[type="text"], input[type="password"] {
        width: 100%; box-sizing: border-box; padding: 6px 8px;
        border: 1px solid rgba(128,128,128,.5); border-radius: 6px;
        background: transparent; color: inherit; font-size: 12px;
      }
      .row { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
      .row label { margin: 0; font-weight: 500; }
      button {
        margin-top: 14px; width: 100%; padding: 8px 12px; cursor: pointer;
        border: 0; border-radius: 6px; background: #2563eb; color: #fff; font-weight: 600;
      }
      button.secondary { background: #6b7280; margin-top: 8px; }
      #status { margin-top: 10px; font-size: 12px; min-height: 18px; word-break: break-word; }
      .ok { color: #16a34a; }
      .err { color: #dc2626; }
      .hint { margin-top: 12px; font-size: 11px; opacity: .6; }
    </style>
  </head>
  <body>
    <h1>reCAPTCHA Auto-Solver</h1>
    <p class="sub">Solves image challenges (static + dynamic) via a vision model.</p>

    <label for="baseUrl">API base URL</label>
    <input id="baseUrl" type="text" placeholder="https://9r.xteam.one/v1" />

    <label for="apiKey">API key</label>
    <input id="apiKey" type="password" placeholder="sk-..." />

    <label for="model">Model</label>
    <input id="model" type="text" placeholder="XaI" />

    <div class="row">
      <input id="enabled" type="checkbox" />
      <label for="enabled">Auto-solve enabled</label>
    </div>

    <button id="save">Save</button>
    <button id="test" class="secondary">Test connection</button>

    <div id="status"></div>

    <p class="hint">
      The extension runs entirely in your browser. It reads the challenge tiles,
      asks the model which ones to click, then clicks them with synthetic mouse
      events.
    </p>

    <script src="popup.js"></script>
  </body>
</html>
